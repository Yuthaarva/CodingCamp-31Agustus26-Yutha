<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <title>To-Do List Life Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <main class="dashboard">
        <!-- =========================
             HEADER / GREETING
        ========================== -->
        <section class="card header-card">

            <button id="themeButton" class="theme-button">
                🌙
            </button>

            <div id="clock" class="clock">
                00:00:00
            </div>

            <div id="date" class="date">
                Monday, January 1, 2026
            </div>

            <h1 id="greeting">
                Good Morning
            </h1>

            <div class="name-section">

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                    maxlength="30"
                >

                <button id="saveNameButton">
                    Save Name
                </button>

            </div>

        </section>


        <!-- =========================
             MAIN CONTENT
        ========================== -->
        <section class="dashboard-grid">


            <!-- =========================
                 FOCUS TIMER
            ========================== -->
            <section class="card timer-card">

                <h2>Focus Timer</h2>

                <div id="timer" class="timer">
                    25:00
                </div>

                <div class="timer-buttons">

                    <button
                        id="startButton"
                        class="primary-button"
                    >
                        Start
                    </button>

                    <button id="stopButton">
                        Stop
                    </button>

                    <button id="resetButton">
                        Reset
                    </button>

                </div>

            </section>


            <!-- =========================
                 TASKS
            ========================== -->
            <section class="card tasks-card">

                <h2>Tasks</h2>

                <form id="taskForm" class="task-form">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Add a new task..."
                        maxlength="100"
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Add
                    </button>

                </form>

                <p id="taskMessage" class="message"></p>

                <ul id="taskList" class="task-list"></ul>

            </section>


            <!-- =========================
                 QUICK LINKS
            ========================== -->
            <section class="card links-card">

                <h2>Quick Links</h2>

                <form id="linkForm" class="link-form">

                    <input
                        type="text"
                        id="linkName"
                        placeholder="Link name"
                        maxlength="30"
                        autocomplete="off"
                    >

                    <input
                        type="text"
                        id="linkUrl"
                        placeholder="URL"
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Add Link
                    </button>

                </form>

                <div id="quickLinks" class="quick-links"></div>

            </section>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
